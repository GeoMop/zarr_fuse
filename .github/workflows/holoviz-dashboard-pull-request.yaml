name: HoloViz Dashboard - pull request

on:
  pull_request:
    branches:
      - "**"
    paths:
      - dashboard/**
  workflow_dispatch:

jobs:
  deploy:
    uses: ./.github/workflows/dashboard-reusable-workflow.yaml
    with:
      dashboard-ref: ${{ github.ref }}
      config-repository: ${{ github.repository }}
      config-ref: ${{ github.ref }}
      endpoints-path: app/databuk/config/endpoints.yaml
      schemas-path: app/databuk/config/schemas
      image-name: jbrezmorf/zarr-fuse-holoviz-frontend
      namespace: zarr-fuse-holoviz-development
      deploy: true
      push-container: true
      tag: generate
      release-name: holoviz-development
      configmap-name: holoviz-dashboard-config
    secrets:
      kubeconfig: ${{ secrets.KUBECONFIG }}
      config_repo_token: ${{ secrets.GITHUB_TOKEN }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      s3_access_key: ${{ secrets.S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.S3_SECRET_KEY }}
