name: HoloViz Dashboard - pull request
on:
  pull_request:
    branches:
      - "**"
    paths:
      - dashboard/**
      - app/databuk/config/**
jobs:
  build-and-deploy:
    name: Build and deploy HoloViz dashboard
    uses: ./.github/workflows/dashboard-reusable-workflow.yaml
    # Every PR deploys the same development release, so runs are queued per workflow, not per branch.
    concurrency:
      group: "${{ github.workflow }}-build-and-deploy"
      cancel-in-progress: false
    with:
      deploy: true
      tag: generate
      namespace: zarr-fuse-dashboard-development
      release-name: holoviz-development
      zarr-fuse-ref: ${{ github.head_ref }}
    secrets: inherit
