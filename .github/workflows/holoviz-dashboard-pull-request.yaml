name: HoloViz Dashboard - pull request
on:
  pull_request:
    branches:
      - "**"
    paths:
      - dashboard/**
      - app/databuk/config/**
  workflow_dispatch:
jobs:
  build-and-deploy:
    name: Build and deploy HoloViz dashboard
    uses: ./.github/workflows/dashboard-reusable-workflow.yaml
    # All PRs deploy the same release, so they share one concurrency group.
    concurrency:
      group: "${{ github.workflow }}-build-and-deploy"
      cancel-in-progress: false
    with:
      deploy: true
      tag: generate
      namespace: zarr-fuse-dashboard-development
      release-name: holoviz-development
      zarr-fuse-ref: ${{ github.head_ref || github.ref_name }}
    secrets: inherit
