name: Reusable dashboard deployment

on:
  workflow_call:
    inputs:
      dashboard-ref:
        description: 'ref for the dashboard repository (branch or commit)'
        required: false
        type: string
      deploy:
        description: 'Whether to deploy the Helm chart'
        required: false
        type: boolean
        default: false
      push-container:
        description: 'Whether to push the frontend image'
        required: false
        type: boolean
        default: true
      config-repository:
        description: 'Repository containing endpoints and schemas (owner/repo)'
        required: true
        type: string
      config-ref:
        description: 'Git ref in config repository (branch or commit)'
        required: true
        type: string
      endpoints-path:
        description: 'Path to endpoints.yaml in the config repository'
        required: true
        type: string
      schemas-path:
        description: 'Path to the schemas directory in the config repository'
        required: true
        type: string
      image-name:
        description: 'Frontend image name'
        required: true
        type: string
      namespace:
        description: 'Kubernetes namespace to deploy into'
        required: false
        type: string
      tag:
        description: 'Image tag / version to deploy'
        required: false
        type: string
        default: 'generate'
      release-name:
        description: 'Helm release name'
        required: false
        type: string
      configmap-name:
        description: 'ConfigMap name for endpoints and schemas'
        required: false
        type: string
        default: 'dashboard-config'
      config-volume-name:
        description: 'Kubernetes volume name for config mount (empty = skip)'
        required: false
        type: string
        default: 'dashboard-config-volume'
    secrets:
      kubeconfig:
        required: true
      config_repo_token:
        required: true
      DOCKER_PASSWORD:
        required: false
      s3_access_key:
        required: true
      s3_secret_key:
        required: true

env:
  ENDPOINTS_POD_PATH: /opt/dashboard/config/endpoints.yaml
  SCHEMAS_POD_PATH: /opt/dashboard/schemas

jobs:
  get-version-tag:
    name: Get version tag
    runs-on: ubuntu-latest
    outputs:
      version-tag: ${{ steps.get_version_tag.outputs.version-tag }}
    steps:
      - name: Checkout dashboard repository
        uses: actions/checkout@v4
        with:
          repository: GeoMop/zarr_fuse
          ref: ${{ inputs['dashboard-ref'] }}
          path: main-repo

      - name: Get version tag
        id: get_version_tag
        run: |
          if [[ ${{ inputs.tag }} == "generate" ]]; then
            echo "version-tag=ci-$(git -C main-repo rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
          else
            echo "version-tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi

  containerize-frontend:
    name: Containerize frontend
    runs-on: ubuntu-latest
    container:
      image: quay.io/buildah/stable:v1.35.4
      options: --privileged
    needs:
      - get-version-tag
    steps:
      - name: Checkout dashboard repository
        uses: actions/checkout@v4
        with:
          repository: GeoMop/zarr_fuse
          ref: ${{ inputs['dashboard-ref'] }}
          path: main-repo

      - name: Containerize
        uses: ./main-repo/.github/actions/containerize
        with:
          repository: ${{ inputs.image-name }}
          tag: ${{ needs.get-version-tag.outputs.version-tag }}
          containerfile-path: dashboard/oci/frontend.Containerfile
          push: ${{ inputs['push-container'] }}
          registry-username: ${{ vars.DOCKER_USERNAME }}
          registry-password: ${{ secrets.DOCKER_PASSWORD }}
          working-directory: main-repo

  lint-helm-chart:
    name: Lint Helm chart
    runs-on: ubuntu-latest
    container:
      image: docker.io/alpine/k8s:1.29.14
    needs:
      - get-version-tag
    steps:
      - name: Checkout dashboard repository
        uses: actions/checkout@v4
        with:
          repository: GeoMop/zarr_fuse
          ref: ${{ inputs['dashboard-ref'] }}
          path: main-repo

      - name: Lint helm chart
        uses: ./main-repo/.github/actions/helm-lint
        with:
          working-directory: main-repo/dashboard/charts/dashboard

  deploy:
    name: Deploy dashboard
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy }}
    needs:
      - get-version-tag
      - containerize-frontend
      - lint-helm-chart
    env:
      KUBECONFIG: ./kubeconfig.yaml
    steps:
      - name: Checkout dashboard repository
        uses: actions/checkout@v4
        with:
          repository: GeoMop/zarr_fuse
          ref: ${{ inputs['dashboard-ref'] }}
          path: main-repo

      - name: Checkout config repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.config-repository }}
          ref: ${{ inputs.config-ref }}
          path: config-repo
          token: ${{ secrets.config_repo_token }}

      - name: Decode kubeconfig
        run: echo "${{ secrets.kubeconfig }}" | base64 -d > kubeconfig.yaml && chmod 600 kubeconfig.yaml

      - name: Ensure namespace exists (check permissions first)
        run: |
          set -euo pipefail
          NS="${{ inputs.namespace }}"
          echo "Checking namespace '$NS'..."
          if kubectl get namespace "$NS" >/dev/null 2>&1; then
            echo "Namespace '$NS' already exists."
          else
            echo "Namespace '$NS' does not exist. Checking permission to create namespaces..."
            if kubectl auth can-i create namespace >/dev/null 2>&1; then
              echo "Permission granted: creating namespace '$NS'..."
              kubectl create namespace "$NS"
            else
              echo "Permission denied: this kubeconfig user cannot create namespaces."
              echo "Please create the namespace '$NS' manually or provide a kubeconfig with namespace-create rights."
              exit 1
            fi
          fi

      - name: Set context to namespace
        run: kubectl config set-context --current --namespace="${{ inputs.namespace }}"

      - name: Validate config files
        run: |
          set -euo pipefail

          ENDPOINTS_FILE="config-repo/${{ inputs['endpoints-path'] }}"
          SCHEMAS_DIR="config-repo/${{ inputs['schemas-path'] }}"

          echo "Checking config files from ${{ inputs.config-repository }}@${{ inputs.config-ref }}"

          test -f "$ENDPOINTS_FILE" || {
            echo "Missing endpoints file: $ENDPOINTS_FILE"
            exit 1
          }
          test -d "$SCHEMAS_DIR" || {
            echo "Missing schemas directory: $SCHEMAS_DIR"
            exit 1
          }

      - name: Create ConfigMap from config files
        run: |
          set -o pipefail
          echo "Creating ConfigMap ${{ inputs.configmap-name }} in namespace '${{ inputs.namespace }}' from:"
          echo " - endpoints: config-repo/${{ inputs['endpoints-path'] }}"
          echo " - schemas dir: config-repo/${{ inputs['schemas-path'] }}"

          if kubectl create configmap "${{ inputs.configmap-name }}" \
            --namespace "${{ inputs.namespace }}" \
            --from-file="endpoints.yaml=config-repo/${{ inputs['endpoints-path'] }}" \
            --from-file="config-repo/${{ inputs['schemas-path'] }}" \
            --dry-run=client -o yaml | kubectl apply -f -; then
            echo "ConfigMap applied successfully."
          else
            echo "Failed to create ConfigMap. Checking permissions and namespace..."
            kubectl auth can-i create configmaps --namespace="${{ inputs.namespace }}" || true
            kubectl get namespace "${{ inputs.namespace }}" -o yaml || true
            kubectl get configmap --namespace="${{ inputs.namespace }}" -o name || true
            echo "If this runner's kubeconfig user lacks permissions, update the KUBECONFIG secret or grant the user create/apply rights in the namespace."
            exit 1
          fi

      - name: Deploy Helm chart from main-repo
        run: |
          FLAGS="--install --atomic --timeout 10m \
            --namespace ${{ inputs.namespace }} \
            --set frontend.image.name=${{ inputs.image-name }} \
            --set frontend.image.tag=${{ needs.get-version-tag.outputs.version-tag }} \
            --set frontend.s3.secrets.accessKey=${{ secrets.s3_access_key }} \
            --set frontend.s3.secrets.secretKey=${{ secrets.s3_secret_key }}"
          if [[ -n "${{ inputs['config-volume-name'] }}" ]]; then
            FLAGS+=" \
              --set frontend.extraEnv[0].name=ENDPOINTS_PATH \
              --set frontend.extraEnv[0].value=${{ env.ENDPOINTS_POD_PATH }} \
              --set frontend.extraEnv[1].name=SCHEMAS_PATH \
              --set frontend.extraEnv[1].value=${{ env.SCHEMAS_POD_PATH }} \
              --set frontend.extraVolumes[0].name=${{ inputs['config-volume-name'] }} \
              --set frontend.extraVolumes[0].configMap.name=${{ inputs.configmap-name }} \
              --set frontend.extraVolumeMounts[0].name=${{ inputs['config-volume-name'] }} \
              --set frontend.extraVolumeMounts[0].mountPath=${{ env.ENDPOINTS_POD_PATH }} \
              --set frontend.extraVolumeMounts[0].subPath=endpoints.yaml \
              --set frontend.extraVolumeMounts[1].name=${{ inputs['config-volume-name'] }} \
              --set frontend.extraVolumeMounts[1].mountPath=${{ env.SCHEMAS_POD_PATH }}"
          fi
          helm upgrade "${{ inputs['release-name'] }}" main-repo/dashboard/charts/dashboard $FLAGS
