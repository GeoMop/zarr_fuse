name: Dashboard reusable deploy

on:
  workflow_call:
    inputs:
      zarr-fuse-ref:
        description: "Ref for the zarr_fuse repository"
        required: true
        type: string

      deploy:
        description: "Whether to deploy the Helm chart"
        required: false
        type: boolean
        default: false

      push-container:
        description: "Whether to push the frontend image"
        required: false
        type: boolean
        default: true

      source_repo:
        description: "Repository containing endpoints and schemas"
        required: true
        type: string

      source_ref:
        description: "Git ref in the source repository"
        required: true
        type: string

      source-endpoints-path:
        description: "Path to endpoints.yaml in the source repository"
        required: true
        type: string

      source-schemas-path:
        description: "Path to the schemas directory in the source repository"
        required: true
        type: string

      frontend_image:
        description: "Frontend image name"
        required: true
        type: string

      namespace:
        description: "Kubernetes namespace"
        required: true
        type: string

      tag:
        description: "Image tag or version"
        required: false
        type: string
        default: "generate"

      release-name:
        description: "Helm release name"
        required: true
        type: string

      configmap_name:
        description: "ConfigMap name for endpoints and schemas"
        required: false
        type: string
        default: "dashboard-config"

      mount-volume-name:
        description: "Kubernetes ConfigMap volume name"
        required: false
        type: string
        default: "hlavo-config"
    secrets:
      kubeconfig:
        required: true
      source_repo_token:
        required: true
      zarr_repo_token:
        required: false
      DOCKER_PASSWORD:
        required: false
      s3_access_key:
        required: true
      s3_secret_key:
        required: true

jobs:
  get-version-tag:
    name: Get version tag
    runs-on: ubuntu-latest
    outputs:
      version-tag: ${{ steps.get_version_tag.outputs.version-tag }}
    steps:
      - name: Checkout zarr_fuse
        uses: actions/checkout@v4
        with:
          repository: GeoMop/zarr_fuse
          ref: ${{ inputs['zarr-fuse-ref'] }}
          path: main-repo
          token: ${{ secrets.zarr_repo_token }}

      - name: Get version tag
        id: get_version_tag
        run: |
          if [[ ${{ inputs.tag }} == "generate" ]]; then
            echo "version-tag=ci-$(git -C main-repo rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
          else
            echo "version-tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi

  containerize-frontend:
    name: Containerize frontend
    runs-on: ubuntu-latest
    container:
      image: quay.io/buildah/stable:v1.35.4
      options: --privileged
    needs:
      - get-version-tag
    steps:
      - name: Checkout zarr_fuse
        uses: actions/checkout@v4
        with:
          repository: GeoMop/zarr_fuse
          ref: ${{ inputs['zarr-fuse-ref'] }}
          path: main-repo
          token: ${{ secrets.zarr_repo_token }}

      - name: Containerize
        uses: ./main-repo/.github/actions/containerize
        with:
          repository: ${{ inputs.frontend_image }}
          tag: ${{ needs.get-version-tag.outputs.version-tag }}
          containerfile-path: dashboard/oci/frontend.Containerfile
          push: ${{ inputs['push-container'] }}
          registry-username: ${{ vars.DOCKER_USERNAME }}
          registry-password: ${{ secrets.DOCKER_PASSWORD }}
          working-directory: main-repo

  lint-helm-chart:
    name: Lint HoloViz Helm chart
    runs-on: ubuntu-latest
    container:
      image: docker.io/alpine/k8s:1.29.14
    needs:
      - get-version-tag
    steps:
      - name: Checkout zarr_fuse
        uses: actions/checkout@v4
        with:
          repository: GeoMop/zarr_fuse
          ref: ${{ inputs['zarr-fuse-ref'] }}
          path: main-repo
          token: ${{ secrets.zarr_repo_token }}

      - name: Lint helm chart
        uses: ./main-repo/.github/actions/helm-lint
        with:
          working-directory: main-repo/dashboard/charts/holoviz

  deploy:
    name: Deploy dashboard
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy }}
    needs:
      - get-version-tag
      - containerize-frontend
      - lint-helm-chart
    env:
      KUBECONFIG: ./kubeconfig.yaml
    steps:
      - name: Checkout zarr_fuse (main-repo)
        uses: actions/checkout@v4
        with:
          repository: GeoMop/zarr_fuse
          ref: ${{ inputs['zarr-fuse-ref'] }}
          path: main-repo
          token: ${{ secrets.zarr_repo_token }}

      - name: Checkout source repo (HLAVO or caller)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          path: source-repo
          token: ${{ secrets.source_repo_token }}

      - name: Decode kubeconfig
        run: echo "${{ secrets.kubeconfig }}" | base64 -d > kubeconfig.yaml && chmod 600 kubeconfig.yaml

      - name: Ensure namespace exists (check permissions first)
        run: |
          set -euo pipefail
          NS="${{ inputs.namespace }}"
          echo "Checking namespace '$NS'..."
          if kubectl get namespace "$NS" >/dev/null 2>&1; then
            echo "Namespace '$NS' already exists."
          else
            echo "Namespace '$NS' does not exist. Checking permission to create namespaces..."
            if kubectl auth can-i create namespace >/dev/null 2>&1; then
              echo "Permission granted: creating namespace '$NS'..."
              kubectl create namespace "$NS"
            else
              echo "Permission denied: this kubeconfig user cannot create namespaces."
              echo "Please create the namespace '$NS' manually or provide a kubeconfig with namespace-create rights."
              exit 1
            fi
          fi

      - name: Set context to namespace
        run: kubectl config set-context --current --namespace="${{ inputs.namespace }}"

      - name: Validate source files
        shell: bash
        run: |
          set -euo pipefail

          ENDPOINTS_FILE="source-repo/${{ inputs['source-endpoints-path'] }}"
          SCHEMAS_DIR="source-repo/${{ inputs['source-schemas-path'] }}"

          if [[ ! -f "$ENDPOINTS_FILE" ]]; then
            echo "Missing endpoints file: $ENDPOINTS_FILE"
            exit 1
          fi

          if [[ ! -d "$SCHEMAS_DIR" ]]; then
            echo "Missing schemas directory: $SCHEMAS_DIR"
            exit 1
          fi

      - name: Create ConfigMap from source files
        shell: bash
        run: |
          set -euo pipefail

          ENDPOINTS_FILE="source-repo/${{ inputs['source-endpoints-path'] }}"
          SCHEMAS_DIR="source-repo/${{ inputs['source-schemas-path'] }}"

          kubectl create configmap "${{ inputs.configmap_name }}" \
            --namespace "${{ inputs.namespace }}" \
            --from-file=endpoints.yaml="$ENDPOINTS_FILE" \
            --from-file="$SCHEMAS_DIR" \
            --dry-run=client \
            -o yaml |
            kubectl apply -f -

      - name: Deploy Helm chart from main-repo
        shell: bash
        run: |
          set -euo pipefail

          readonly POD_ENDPOINTS_PATH="/opt/hlavo/dashboard/config/endpoints.yaml"
          readonly POD_SCHEMAS_PATH="/opt/hlavo/dashboard/schemas"

          HELM_ARGS=(
            --install
            --atomic
            --timeout
            10m
            --namespace
            "${{ inputs.namespace }}"
            --set-string
            "frontend.image.name=${{ inputs.frontend_image }}"
            --set-string
            "frontend.image.tag=${{ needs.get-version-tag.outputs.version-tag }}"
            --set-string
            "frontend.s3.secrets.accessKey=${{ secrets.s3_access_key }}"
            --set-string
            "frontend.s3.secrets.secretKey=${{ secrets.s3_secret_key }}"
          )

          if [[ -n "${{ inputs['mount-volume-name'] }}" ]]; then
            HELM_ARGS+=(
              --set-string
              "frontend.extraEnv[0].name=ENDPOINTS_PATH"
              --set-string
              "frontend.extraEnv[0].value=$POD_ENDPOINTS_PATH"

              --set-string
              "frontend.extraEnv[1].name=SCHEMAS_PATH"
              --set-string
              "frontend.extraEnv[1].value=$POD_SCHEMAS_PATH"

              --set-string
              "frontend.extraVolumes[0].name=${{ inputs['mount-volume-name'] }}"
              --set-string
              "frontend.extraVolumes[0].configMap.name=${{ inputs.configmap_name }}"

              --set-string
              "frontend.extraVolumeMounts[0].name=${{ inputs['mount-volume-name'] }}"
              --set-string
              "frontend.extraVolumeMounts[0].mountPath=$POD_ENDPOINTS_PATH"
              --set-string
              "frontend.extraVolumeMounts[0].subPath=endpoints.yaml"

              --set-string
              "frontend.extraVolumeMounts[1].name=${{ inputs['mount-volume-name'] }}"
              --set-string
              "frontend.extraVolumeMounts[1].mountPath=$POD_SCHEMAS_PATH"
            )
          fi

          helm upgrade \
            "${{ inputs['release-name'] }}" \
            main-repo/dashboard/charts/holoviz \
            "${HELM_ARGS[@]}"
