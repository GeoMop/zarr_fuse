name: Dashboard - reusable workflow
on:
  workflow_call:
    inputs:
      push-container:
        description: Whether to push the container image
        required: false
        type: boolean
        default: true
      deploy:
        description: Whether to deploy the Helm chart
        required: false
        type: boolean
        default: false
      tag:
        description: The tag to use for the container image
        required: false
        type: string
        default: generate
      namespace:
        description: The Kubernetes namespace to use
        required: false
        type: string
      release-name:
        description: The Helm release name to use
        required: false
        type: string
      docker-repository:
        description: The Docker repository to use
        required: false
        type: string
        default: jbrezmorf/zarr-fuse-holoviz-frontend
      docker-registry:
        description: The Docker registry to use
        required: false
        type: string
        default: docker.io
      views-path:
        description: Path to zf_view.yaml in the caller repository; its source.schema_path entries name the schemas
        required: true
        type: string
      extra-helm-args:
        description: Extra Helm arguments to pass during deployment
        required: false
        type: string
        default: ""
      zarr-fuse-ref:
        description: "Ref/branch/tag of the GeoMop/zarr_fuse repository for external use"
        required: false
        type: string
        default: "main"
    secrets:
      DOCKER_PASSWORD:
        description: "Docker registry password for pushing images"
        required: false
      KUBECONFIG:
        description: "Base64-encoded kubeconfig for Kubernetes deployment"
        required: false
      S3_ACCESS_KEY:
        description: "S3 access key"
        required: false
      S3_SECRET_KEY:
        description: "S3 secret key"
        required: false
jobs:
  get-version-tag:
    name: Get version tag
    runs-on: ubuntu-latest
    outputs:
      version-tag: ${{ steps.get_version_tag.outputs.version_tag }}
    steps:
      - name: Checkout zarr_fuse
        uses: actions/checkout@v6
        with:
          repository: GeoMop/zarr_fuse
          ref: ${{ inputs.zarr-fuse-ref }}

      - name: Get version tag
        id: get_version_tag
        run: |
          if [[ ${{ inputs.tag }} == "generate" ]]; then
            echo "version_tag=ci-$(git rev-parse --short=7 HEAD)" >> $GITHUB_OUTPUT
          else
            echo "version_tag=${{ inputs.tag }}" >> $GITHUB_OUTPUT
          fi

  prepare-configuration:
    name: Prepare dashboard configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller repository
        uses: actions/checkout@v6

      - name: Copy configuration files
        shell: bash
        run: |
          VIEWS_FILE="${{ inputs.views-path }}"
          # As in the dashboard, schema_path is relative to the parent of zf_view.yaml's directory.
          # The pod finds the schemas by file name, so they are copied flat.
          BASE_DIR="$(dirname "$(dirname "$VIEWS_FILE")")"

          mkdir -p ci-config
          cp "$VIEWS_FILE" ci-config/zf_view.yaml
          yq '.[].source.schema_path | select(. != null)' "$VIEWS_FILE" | while read -r SCHEMA; do
            cp "$BASE_DIR/$SCHEMA" ci-config/
          done

      - name: Upload configuration files as artifact
        uses: actions/upload-artifact@v6
        with:
          name: dashboard-configuration
          path: ci-config/

  containerize:
    name: Containerize dashboard
    runs-on: ubuntu-latest
    needs:
      - get-version-tag
    container:
      image: quay.io/buildah/stable:v1.35.4
      options: --privileged
    steps:
      - name: Checkout zarr_fuse
        uses: actions/checkout@v6
        with:
          repository: GeoMop/zarr_fuse
          ref: ${{ inputs.zarr-fuse-ref }}

      - name: Containerize
        uses: ./.github/actions/containerize
        with:
          registry: ${{ inputs.docker-registry }}
          repository: ${{ inputs.docker-repository }}
          tag: ${{ needs.get-version-tag.outputs.version-tag }}
          containerfile-path: dashboard/oci/frontend.Containerfile
          push: ${{ inputs.push-container }}
          registry-username: ${{ vars.DOCKER_USERNAME }}
          registry-password: ${{ secrets.DOCKER_PASSWORD }}
          working-directory: .
          extra-build-args: --build-arg APP_VERSION="${{ needs.get-version-tag.outputs.version-tag }}"

  lint-helm-chart:
    name: Lint dashboard Helm chart
    runs-on: ubuntu-latest
    container:
      image: docker.io/alpine/k8s:1.29.14
    needs:
      - containerize
    steps:
      - name: Checkout zarr_fuse
        uses: actions/checkout@v6
        with:
          repository: GeoMop/zarr_fuse
          ref: ${{ inputs.zarr-fuse-ref }}

      - name: Lint helm chart
        uses: ./.github/actions/helm-lint
        with:
          working-directory: dashboard/charts/holoviz
          values: --values values/minimal-required-values.yaml

  deploy:
    name: Deploy dashboard to e-infra rancher
    runs-on: ubuntu-latest
    if: ${{ inputs.deploy }}
    container:
      image: docker.io/alpine/k8s:1.29.14
    needs:
      - lint-helm-chart
      - get-version-tag
      - prepare-configuration
    env:
      KUBECONFIG: ./kubeconfig.yaml
    defaults:
      run:
        working-directory: dashboard/charts
    steps:
      - name: Checkout zarr_fuse
        uses: actions/checkout@v6
        with:
          repository: GeoMop/zarr_fuse
          ref: ${{ inputs.zarr-fuse-ref }}

      - name: Download configuration files artifact
        uses: actions/download-artifact@v7
        with:
          name: dashboard-configuration
          path: dashboard/charts/holoviz/config/

      - name: Decode kubeconfig
        run: echo "${{ secrets.KUBECONFIG }}" | base64 -d > kubeconfig.yaml && chmod 600 kubeconfig.yaml

      - name: Set context
        run: kubectl config set-context --current --namespace="${{ inputs.namespace }}"

      # Chart 0.2.x named the Ingress holoviz-ingress. The ingress-nginx admission webhook rejects the renamed
      # Ingress while the old one claims the same host. Drop this step once no release runs chart 0.2.x.
      - name: Remove chart 0.2.x Ingress
        run: |
          OWNER=$(kubectl get ingress holoviz-ingress --ignore-not-found \
            -o jsonpath='{.metadata.annotations.meta\.helm\.sh/release-name}')
          if [ "$OWNER" = "${{ inputs.release-name }}" ]; then
            kubectl delete ingress holoviz-ingress
          fi

      - name: Deploy app
        run: |
          helm upgrade ${{ inputs.release-name }} holoviz \
          --install --atomic --timeout 10m --namespace "${{ inputs.namespace }}" \
          --set registry.host="${{ inputs.docker-registry }}" \
          --set frontend.image.name="${{ inputs.docker-repository }}" \
          --set frontend.image.tag="${{ needs.get-version-tag.outputs.version-tag }}" \
          --set frontend.s3.secrets.accessKey="${{ secrets.S3_ACCESS_KEY }}" \
          --set frontend.s3.secrets.secretKey="${{ secrets.S3_SECRET_KEY }}" \
          --set frontend.config.enabled=true \
          ${{ inputs.extra-helm-args }}
