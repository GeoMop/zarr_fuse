name: Dashboard - push main
on:
  workflow_dispatch:
  push:
    branches:
      - dashboard-main
    paths:
      - dashboard/**
jobs:
  build-and-deploy:
    uses: ./.github/workflows/dashboard-reusable-workflow.yaml
    concurrency:
      group: "${{ github.workflow }}-${{ github.ref_name }}-build-and-deploy"
      cancel-in-progress: false
    with:
      deploy: true
      tag: generate
      namespace: zarr-fuse-dashboard
      release-name: dashboard
      views-path: dashboard/test_deployment/databuk/config/zf_view.yaml
      zarr-fuse-ref: ${{ github.ref_name }}
    secrets:
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      KUBECONFIG: ${{ secrets.KUBECONFIG }}
      S3_ACCESS_KEY: ${{ secrets.S3_ACCESS_KEY }}
      S3_SECRET_KEY: ${{ secrets.S3_SECRET_KEY }}
