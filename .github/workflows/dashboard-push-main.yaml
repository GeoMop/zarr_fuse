name: Dashboard - push main
on:
  push:
    branches:
      - dashboard-main
    paths:
      - app/databuk/dashboard/**
  workflow_dispatch:
jobs:
  build-and-deploy:
    name: Build and lint dashboard
    uses: ./.github/workflows/dashboard-reusable-workflow.yaml
    with:
      zarr-fuse-ref: ${{ github.sha }}

      source_repo: ${{ github.repository }}
      source_ref: ${{ github.sha }}
      source-endpoints-path: app/databuk/config/endpoints.yaml
      source-schemas-path: app/databuk/config/schemas

      frontend_image: jbrezmorf/zarr-fuse-holoviz-frontend
      namespace: zarr-fuse-dashboard
      release-name: dashboard

      deploy: true
      tag: generate
    secrets: inherit
