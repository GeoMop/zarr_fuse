name: Dashboard - push main
on:
  workflow_dispatch:
  push:
    branches:
      - dashboard-main
    paths:
      - dashboard/**
      - app/databuk/config/**
jobs:
  build-and-deploy:
    uses: ./.github/workflows/dashboard-reusable-workflow.yaml
    concurrency:
      group: "${{ github.workflow }}-${{ github.ref_name }}-build-and-deploy"
      cancel-in-progress: false
    with:
      deploy: true
      tag: generate
      namespace: zarr-fuse-dashboard
      release-name: dashboard
      zarr-fuse-ref: ${{ github.ref_name }}
    secrets: inherit
