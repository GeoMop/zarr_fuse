name: Dashboard - pull request
on:
  pull_request:
    branches:
      - "**"
    paths:
      - app/databuk/dashboard/**
  workflow_dispatch:
jobs:
  build:
    name: Build and lint dashboard
    uses: ./.github/workflows/dashboard-reusable-workflow.yaml
    with:
      zarr-fuse-ref: ${{ github.sha }}

      source_repo: ${{ github.repository }}
      source_ref: ${{ github.sha }}
      source-views-path: app/databuk/config/zf_view.yaml
      source-schemas-path: app/databuk/config/schemas

      frontend_image: jbrezmorf/zarr-fuse-holoviz-frontend
      namespace: zarr-fuse-dashboard-development
      release-name: dashboard-development

      deploy: true
      tag: generate
    secrets:
      kubeconfig: ${{ secrets.KUBECONFIG }}
      source_repo_token: ${{ secrets.GITHUB_TOKEN }}
      zarr_repo_token: ${{ secrets.GITHUB_TOKEN }}
      DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      s3_access_key: ${{ secrets.S3_ACCESS_KEY }}
      s3_secret_key: ${{ secrets.S3_SECRET_KEY }}
