{{- if and (not .Values.persistence.enabled) (not (hasPrefix "s3://" .Values.deployment.queue.path)) }}
{{- fail "persistence.enabled=false requires deployment.queue.path to be an s3:// URL (readOnlyRootFilesystem forbids a local queue without a PVC)" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.app.name }}
  labels:
    app.kubernetes.io/name: {{ .Values.app.name }}
spec:
  replicas: {{ .Values.deployment.replicaCount }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Values.app.name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Values.app.name }}
    spec:
      securityContext:
        {{- toYaml .Values.securityContext.pod | nindent 8 }}
      volumes:
        - name: ingress-server-tmp
          emptyDir: {}
        {{- if .Values.persistence.enabled }}
        - name: ingress-server-queue
          persistentVolumeClaim:
            claimName: "{{ .Values.app.name }}-queue-pvc"
        {{- end }}
      containers:
        - name: {{ .Values.app.name }}
          image: "{{ .Values.registry.host }}/{{ .Values.image.name }}:{{ .Values.image.tag }}"
          imagePullPolicy: Always
          ports:
            - name: {{ .Values.service.internalPort.name | quote }}
              containerPort: {{ .Values.service.internalPort.number | int }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.securityContext.container | nindent 12 }}
          envFrom:
            - secretRef:
                name: {{ .Values.app.name }}-env-secrets
          volumeMounts:
            - name: ingress-server-tmp
              mountPath: /tmp
            {{- if .Values.persistence.enabled }}
            - name: ingress-server-queue
              mountPath: {{ .Values.deployment.queue.path | quote }}
            {{- end }}
          startupProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 5
            periodSeconds: 5
            successThreshold: 1
            failureThreshold: 72
          livenessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 5
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 10
          readinessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 5
            periodSeconds: 30
            successThreshold: 1
            failureThreshold: 10
