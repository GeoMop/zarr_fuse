ATTRS:
  description: "Ingress queue manifest: an append-only log of the item states."
items:
  COORDS:
    time:
      description: "Time the row was recorded."
      unit: {tick: "us", tz: "UTC"}
      sorted: false
      chunk_size: 256
  VARS:
    item_name:
      description: "Payload object name within its queue folder; its metadata is in the .meta.json sidecar next to it."
      type: "str[128]"
      coords: time
    source:
      description: "Endpoint or active scrapper that received the payload."
      type: "str[64]"
      coords: time
    state:
      description: "accepted, success or failed; the last row of an item is its current state."
      type: "str[16]"
      coords: time
    sha256:
      description: "SHA-256 hex digest of the payload."
      type: "str[64]"
      coords: time
    data_time:
      description: "Minimum of the time_like_coord values of the payload, empty when unknown."
      type: "str[32]"
      coords: time
    error:
      description: "Reason of the failure of a failed item."
      type: "str[256]"
      coords: time
