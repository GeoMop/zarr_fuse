registry:
  host: docker.io

frontend:
  name: dashboard
  replicaCount: 1
  endpointName: bukov_endpoint
  cacheDir: /tmp/zf_tiles
  image:
    name: docker.io/dashboard-frontend
    tag: latest
    pullPolicy: Always

  service:
    type: ClusterIP
    externalPort:
      number: 5006
      name: http
    internalPort:
      number: 5006
      name: http

  s3:
    endpointUrl: "https://s3.cl4.du.cesnet.cz"
    secrets:
      accessKey: "your-access-key"
      secretKey: "your-secret-key"

  extraEnv: []

  extraVolumes: []

  extraVolumeMounts: []

  resources:
    requests:
      cpu: 125m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  securityContext:
    pod:
      fsGroup: 11233
      runAsNonRoot: true
      runAsUser: 11233
      runAsGroup: 11233
    container:
      capabilities:
        drop:
          - ALL
      allowPrivilegeEscalation: false
      privileged: false
      runAsNonRoot: true
      runAsUser: 11233
      runAsGroup: 11233
      seccompProfile:
        type: RuntimeDefault

ingress:
  name: dashboard-ingress
  className: "nginx"
  host: ""
  tlsSecretName: ""
  annotations:
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
