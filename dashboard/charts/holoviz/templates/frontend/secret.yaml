{{- if not .Values.frontend.s3.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "holoviz.s3SecretName" . }}
  labels:
    {{- include "holoviz.labels" . | nindent 4 }}
type: Opaque
stringData:
  ZF_S3_ACCESS_KEY: {{ required "frontend.s3.secrets.accessKey is required (or set frontend.s3.existingSecret)" .Values.frontend.s3.secrets.accessKey | quote }}
  ZF_S3_SECRET_KEY: {{ required "frontend.s3.secrets.secretKey is required (or set frontend.s3.existingSecret)" .Values.frontend.s3.secrets.secretKey | quote }}
  ZF_S3_ENDPOINT_URL: {{ required "frontend.s3.endpointUrl is required (or set frontend.s3.existingSecret)" .Values.frontend.s3.endpointUrl | quote }}
{{- end }}
