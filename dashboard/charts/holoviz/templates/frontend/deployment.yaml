apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "holoviz.fullname" . }}
  labels:
    {{- include "holoviz.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.frontend.replicaCount | int }}
  selector:
    matchLabels:
      {{- include "holoviz.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "holoviz.labels" . | nindent 8 }}
      {{- if .Values.frontend.config.enabled }}
      annotations:
        # Restart the pods whenever the staged configuration changes.
        checksum/config: {{ include (print $.Template.BasePath "/frontend/configmap.yaml") . | sha256sum }}
      {{- end }}
    spec:
      securityContext:
        {{- toYaml .Values.frontend.securityContext.pod | nindent 8 }}
      volumes:
        - name: app-home
          emptyDir: {}
        {{- if .Values.frontend.config.enabled }}
        - name: config
          configMap:
            name: {{ include "holoviz.configMapName" . }}
        {{- end }}
        {{- with .Values.frontend.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: frontend
          image: "{{ .Values.registry.host }}/{{ .Values.frontend.image.name }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}
          ports:
            - name: {{ .Values.frontend.service.internalPort.name | quote }}
              containerPort: {{ .Values.frontend.service.internalPort.number | int }}
          envFrom:
            - secretRef:
                name: {{ include "holoviz.s3SecretName" . }}
          env:
            - name: HV_DASHBOARD_VIEW
              value: {{ .Values.frontend.viewName | quote }}
            - name: BOKEH_ALLOW_WS_ORIGIN
              value: {{ include "holoviz.host" . | quote }}
            - name: ZF_CACHE_DIR
              value: {{ .Values.frontend.cacheDir | quote }}
            - name: HOME
              value: /home
            - name: MPLCONFIGDIR
              value: /home/app/.config/matplotlib
            {{- if .Values.frontend.config.enabled }}
            - name: ZF_VIEW_PATH
              value: {{ printf "%s/%s" .Values.frontend.config.mountPath .Values.frontend.config.viewFile | quote }}
            - name: SCHEMAS_PATH
              value: {{ .Values.frontend.config.mountPath | quote }}
            {{- end }}
            {{- with .Values.frontend.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          volumeMounts:
            - name: app-home
              mountPath: /home/app
            {{- if .Values.frontend.config.enabled }}
            - name: config
              mountPath: {{ .Values.frontend.config.mountPath | quote }}
              readOnly: true
            {{- end }}
            {{- with .Values.frontend.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
          securityContext:
            {{- toYaml .Values.frontend.securityContext.container | nindent 12 }}
          startupProbe:
            tcpSocket:
              port: {{ .Values.frontend.service.internalPort.name | quote }}
            periodSeconds: 5
            failureThreshold: 72
          livenessProbe:
            tcpSocket:
              port: {{ .Values.frontend.service.internalPort.name | quote }}
            periodSeconds: 30
            failureThreshold: 10
          readinessProbe:
            tcpSocket:
              port: {{ .Values.frontend.service.internalPort.name | quote }}
            periodSeconds: 30
            failureThreshold: 10
