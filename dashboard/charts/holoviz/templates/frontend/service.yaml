apiVersion: v1
kind: Service
metadata:
  name: {{ include "holoviz.fullname" . }}
  labels:
    {{- include "holoviz.labels" . | nindent 4 }}
spec:
  type: {{ .Values.frontend.service.type }}
  selector:
    {{- include "holoviz.selectorLabels" . | nindent 4 }}
  ports:
    - name: {{ .Values.frontend.service.externalPort.name | quote }}
      port: {{ .Values.frontend.service.externalPort.number | int }}
      targetPort: {{ .Values.frontend.service.internalPort.name | quote }}
