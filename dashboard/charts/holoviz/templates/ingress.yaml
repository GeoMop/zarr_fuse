{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "holoviz.fullname" . }}
  labels:
    {{- include "holoviz.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ include "holoviz.host" . | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "holoviz.fullname" . }}
                port:
                  number: {{ .Values.frontend.service.externalPort.number | int }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - secretName: {{ include "holoviz.tlsSecretName" . }}
      hosts:
        - {{ include "holoviz.host" . | quote }}
  {{- end }}
{{- end }}
