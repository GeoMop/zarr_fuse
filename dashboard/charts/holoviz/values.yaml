nameOverride: ""
fullnameOverride: ""

registry:
  host: docker.io

frontend:
  replicaCount: 1
  viewName: bukov_endpoint
  cacheDir: /tmp/zf_tiles
  image:
    name: jbrezmorf/zarr-fuse-holoviz-frontend
    tag: latest
    pullPolicy: Always

  service:
    type: ClusterIP
    externalPort:
      number: 5006
      name: http
    internalPort:
      number: 5006
      name: http

  s3:
    # Secret with ZF_S3_ACCESS_KEY, ZF_S3_SECRET_KEY and ZF_S3_ENDPOINT_URL, created outside Helm.
    # When empty, the chart creates the Secret from endpointUrl and secrets.
    existingSecret: ""
    endpointUrl: "https://s3.cl2.du.cesnet.cz"
    secrets:
      accessKey: ""
      secretKey: ""

  # Mount zf_view.yaml and the schemas copied into the chart's config/ directory.
  config:
    enabled: false

  extraEnv: []

  extraVolumes: []

  extraVolumeMounts: []

  resources:
    requests:
      cpu: 125m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

  securityContext:
    pod:
      fsGroup: 11233
      runAsNonRoot: true
      runAsUser: 11233
      runAsGroup: 11233
    container:
      capabilities:
        drop:
          - ALL
      allowPrivilegeEscalation: false
      privileged: false
      runAsNonRoot: true
      runAsUser: 11233
      runAsGroup: 11233
      seccompProfile:
        type: RuntimeDefault

ingress:
  className: "nginx"
  annotations:
    kubernetes.io/tls-acme: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
