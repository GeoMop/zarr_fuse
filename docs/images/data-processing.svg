  <title
     id="title">zarr-fuse data processing</title>
  <desc
     id="description">
    Raw data from measurements and models are filtered and checked against a schema by the ingress service.
    Contributions are merged by their coordinates in Zarr and explored through maps and time series in the dashboard.
  </desc>
