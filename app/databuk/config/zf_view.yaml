_dashboard:
  default_endpoint: "bukov_endpoint"
  env_file: "../../dashboard/scripts/.env"

_cluster_defaults: &cluster_defaults
  cluster_enabled: true
  cluster_eps_factor: 0.05
  cluster_buffer_factor: 0.1
  cluster_size_scale: 3.0

bukov_endpoint:
  description: "Bukov production view"
  version: "1.0.0"
  reload_interval: 300

  source:
    type: "s3"
    store_type: "zarr"
    uri: "s3://bukov/store_latlon_2024.zarr"
    schema_path: "config/schemas/bukov_schema.yaml"

  variable_map:
    bukov:
      lat: "latitude"
      lon: "longitude"
      time: "date_time"
      vertical: "depth"
      entity: "borehole"

  defaults:
    display_variable: "rock_temp"
    group_path: "/"
    default_site: "ZK1-S4"

  visualization:
    map:
      title: "Geographic Data View"
      point_size: 10
      alpha: 0.8
      cluster:
        <<: *cluster_defaults

    timeseries:
      middle_window_days: 30
      right_window_hours: 24

    overlay:
      enabled: true
      tile_url: "/tiles/{Z}/{X}/{Y}.png"
      source_uri: "s3://app-databuk-test-service/overlays/bukov/"
      cache_dir: "."

  tile_build:
    source_image: "config/source_overlay/12p_final.png"
    georef_file: "config/source_overlay/bukov_georef.json"
    vrt_file: "test_overlay/source_gcps.vrt"
    warped_tif: "test_overlay/source_3857.tif"
    rgba_vrt: "test_overlay/source_3857_rgba.vrt"
    tiles_dir: "test_overlay/tiles"
    min_zoom: 0
    max_zoom: 20
    target_srs: "EPSG:3857"
    gcp_srs: "EPSG:4326"
    resampling: "near"
    tile_resampling: "average"
    s3:
      bucket: "app-databuk-test-service"
      prefix: "overlays/bukov/"